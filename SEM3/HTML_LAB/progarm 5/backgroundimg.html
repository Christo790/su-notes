Write a HTML and CSS program for Displaying Background Images with styles. -->

<html>

<head>
    <title>Mangalore</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1642332022568-440204d0dc4a?q=80&w=736&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            min-height: 100vh;
            color: white;
            text-align: center;
        }

        .content {
            padding-top: 150px;
        }

        h1 {
            font-size: 50px;
        }

        p {
            font-size: 22px;
            width: 70%;
            margin: auto;
        }
    </style>
</head>

<body>
    <div class="content">
        <h1>
            <marquee>Explore the Mangalore</marquee>
        </h1>
        <p>
            Mangalore, officially known as Mangaluru, is a major port city on the Arabian Sea coast in the Indian state
            of Karnataka. It is known for its cultural diversity, beautiful beaches, and a blend of modern and
            traditional lifestyles.
        </p>

    </div>
</body>

</html>
